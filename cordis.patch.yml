# QQ Hub —— DSH bundle patch（插件自带的挂载声明）
#
# 1) aurabot：插件本体（宿主半边 src/host.js + 网页半边 client/client.js）
# 2) 两个 agent preset，只给 QQ Hub 自己建的 QQ 会话用：
#    - qq-hub-private：主人私聊，完整工具 + 大肥鱼人格
#    - qq-hub-private-long：同上，另挂 jobs + schedule（面板「长任务模式」打开时用，默认关）
#    - qq-hub-social ：群聊 / 其他人私聊，没有任何本地工具（shell / 文件 / 网络），只有插件按会话挂的 QQ 工具
#    人格通过提示词变量 {{qq_hub_persona}} 放在系统提示词最前面（由插件注册，面板切换人格即时生效）。
- insert:
    - id: qq-hub
      name: dsh-qq-hub
    - id: preset-qq-hub-private
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qq-hub-private
        name: QQ Hub · 主人私聊
        description: QQ Hub 在 QQ 上和主人私聊时用：人格 + 完整工具
        order: 60
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{qq_hub_persona}}\n\n{{qq_hub_rules_private}}"
              # 人格独占系统提示词：不带 DSH 那一大段编程助手身份和工具指南（实测私聊从 1~4 分钟一轮降下来）。
              # 工具照样挂着，模型靠工具定义本身就会用。
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
            config:
              # 默认 10 分钟才刷新一次：连续聊天时她的「现在」会停在旧时间点
              #（实测 19:50 的消息，她手里还是 19:42 那个时间戳）。改成 1 分钟。
              # 每轮那行中文时间锚是插件自己加的（src/chat/clockline.js），这条只管 DSH 那份也保持新鲜。
              refreshIntervalMs: 60000
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
    - id: preset-qq-hub-private-long
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qq-hub-private-long
        name: QQ Hub · 主人私聊（长任务模式）
        description: 主人私聊 + 后台任务（jobs）和定时任务（schedule）：长任务跑完会自动唤醒汇报
        order: 62
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{qq_hub_persona}}\n\n{{qq_hub_rules_private}}"
              # 人格独占系统提示词：不带 DSH 那一大段编程助手身份和工具指南（实测私聊从 1~4 分钟一轮降下来）。
              # 工具照样挂着，模型靠工具定义本身就会用。
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
            config:
              # 默认 10 分钟才刷新一次：连续聊天时她的「现在」会停在旧时间点
              #（实测 19:50 的消息，她手里还是 19:42 那个时间戳）。改成 1 分钟。
              # 每轮那行中文时间锚是插件自己加的（src/chat/clockline.js），这条只管 DSH 那份也保持新鲜。
              refreshIntervalMs: 60000
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          # 长任务模式：后台跑命令、完成后自动唤醒；以及一次性/周期定时任务
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
    - id: preset-qq-hub-social
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qq-hub-social
        name: QQ Hub · 群聊
        description: QQ 群和陌生人私聊时用：人格 + 只有 QQ 社交工具，没有任何电脑操作能力
        order: 61
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "{{qq_hub_persona}}\n\n{{qq_hub_rules_social}}"
              complete: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
            config:
              # 默认 10 分钟才刷新一次：连续聊天时她的「现在」会停在旧时间点
              #（实测 19:50 的消息，她手里还是 19:42 那个时间戳）。改成 1 分钟。
              # 每轮那行中文时间锚是插件自己加的（src/chat/clockline.js），这条只管 DSH 那份也保持新鲜。
              refreshIntervalMs: 60000
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
