name: PII Scan

# 2026-11-23：全仓审计发现注释 / CHANGELOG / 测试夹具里写死了十几个真实 QQ 群号与 QQ 号，
# 在公开历史里躺了三周。这道门禁对每个 PR 跑仓库自带的零依赖扫描器（scripts/pii-scan.mjs），
# 与本地 pre-push 钩子同一份规则。先自检再扫：坏掉的扫描器会给出假的「干净」。

on:
  pull_request:
  push:
    branches:
      - main
      - 'refactor/**'
      - 'backup/**'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 需要完整历史：--range 要能算出 PR 相对基线分支的新增行与提交信息
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Scanner Self-Test
        run: node scripts/pii-scan.mjs selftest

      - name: Scan Whole Tree
        run: node scripts/pii-scan.mjs --tree

      # 审计 T2.8：事件上下文（分支名 / commit SHA）全部经 env 注入。
      # 直接把 `${{ github.base_ref }}` 插进 bash 双引号里，等于把不可信字符串喂给 shell
      # （分支名可以带 `$(...)` 一类字符）。
      - name: Determine Incoming Range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "spec=origin/$BASE_REF..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "spec=$BEFORE..HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan Incoming Commits (diff + messages)
        env:
          RANGE_SPEC: ${{ steps.range.outputs.spec }}
        run: node scripts/pii-scan.mjs git --range "$RANGE_SPEC"
