name: Pack Test Build

# 官方打包通道：在 GitHub Actions 上把当前分支构建成 dsh-qq-hub 测试 tgz，
# 发布为 prerelease（附 sha256），同时保留 workflow artifact 以便回查。
# 与 Verify 的区别：不跑全量测试（测试是 PR 门禁的事），这里只负责可复现的打包与发布。
#
# 审计 T2.8：构建与发布拆成两个 job。构建阶段（npm ci / 生命周期脚本 / esbuild）
# 只拿到 contents: read；写权限只存在于 publish job，它不做任何构建，只把已产出的
# 产物交给 Release。所有第三方 action 固定到 40 位 commit SHA（与 release.yml 同一份）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '测试包版本号（形如 1.4.0-test.YYYYMMDD.N）'
        required: true
        default: '1.4.0-test.20261112.1'
      release_title:
        description: 'Release 标题（留空自动生成）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tgz: ${{ steps.pack.outputs.tgz }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 构建阶段不推任何东西：别把 token 留在 .git/config 给 npm 生命周期脚本用
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # client/client.js 是 esbuild 产物：打包前必须现构建，否则 tgz 里带的是仓库里提交的那份，
      # client/src 改了而产物没跟上时，发出去的包会是旧界面（package.json 的 prepack 同样会构建，
      # 这里显式列出是为了在日志里看得见、失败得早）。
      - name: Install Build Dependencies
        run: npm ci

      - name: Build Client Bundle
        run: npm run build:client

      - name: Set version in package.json (build-only; repo copy not committed)
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const v = process.env.VERSION || ''
          if (!/^1\.\d+\.\d+-test\.\d{8}\.\d+$/.test(v)) {
            console.error(`bad version: "${v}"（要求形如 1.4.0-test.20261112.1）`)
            process.exit(2)
          }
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          p.version = v
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')
          console.log('version =>', v)
          NODE

      - name: npm pack
        id: pack
        run: |
          OUT=$(npm pack 2>/dev/null)
          TGZ=$(echo "$OUT" | tail -n1)
          if [ -z "$TGZ" ] || [ ! -f "$TGZ" ]; then
            echo "npm pack 失败或未产出 tgz："; echo "$OUT"; exit 1
          fi
          echo "tgz=$TGZ" >> "$GITHUB_OUTPUT"
          sha256sum "$TGZ" | tee sha256.txt
          echo "sha256=$(cut -d' ' -f1 sha256.txt)" >> "$GITHUB_OUTPUT"

      - name: Smoke check packaged host entrypoint
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke
          tar -xzf "$TGZ" -C /tmp/smoke
          node --input-type=module -e "const h = await import('file:///tmp/smoke/package/src/host.js'); if (typeof h.apply !== 'function') { console.error('apply missing'); process.exit(1) }; console.log('SMOKE OK')"
          node --input-type=module -e "
          import { readFileSync } from 'node:fs'
          const p = '/tmp/smoke/package/client/client.js'
          const s = readFileSync(p, 'utf8')
          if (s.length < 100000 || !s.includes('__ModuleLoader__') || !s.includes('QQHubPage')) {
            console.error('client bundle missing or stale: ' + p)
            process.exit(1)
          }
          console.log('CLIENT BUNDLE OK', (s.length / 1024).toFixed(1) + ' KB')
          "

      - name: Release notes
        env:
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.release_title }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## $VERSION"
            echo
            echo "- 来源：\`$GITHUB_REPOSITORY\` 分支 \`${GITHUB_REF_NAME}\`，commit \`$SHA\`"
            echo "- 构建：GitHub Actions run \`$GITHUB_RUN_ID\`（node 22 / ubuntu-latest，npm pack）"
            echo "- sha256：$(cut -d' ' -f1 sha256.txt)"
            echo "- 安装/回退参照 README 与 docs/refactor/new-core-parity-ledger.md"
          } > notes.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dsh-test-build
          path: |
            *.tgz
            sha256.txt
            notes.md
          if-no-files-found: error

  # ── 发布：唯一持有写权限的 job ──────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-test-build

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TITLE: ${{ inputs.release_title }}
          TGZ: ${{ needs.build.outputs.tgz }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          # 版本号 / 文件名只经 env 进来；脚本里一律用双引号包住的变量，不做表达式插值
          test -f "$TGZ"
          echo "publishing $TGZ (sha256=$SHA256)"
          gh release create "$VERSION" "$TGZ" sha256.txt \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "${TITLE:-dsh-qq-hub $VERSION (test build)}" \
            --notes-file notes.md
