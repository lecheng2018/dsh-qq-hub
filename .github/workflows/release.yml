# DSH 插件自动发布工作流
#
# 触发策略（避免文档/杂项改动污染 Release 列表）：
#   1. push tag (v*)          —— 正式发版：更新 package.json version 后打 tag 推送
#   2. workflow_dispatch      —— 手动发版：Actions 页面点 Run workflow
#   3. push main 且代码有变更  —— 自动判断：只看 src/、client/、cordis.patch.yml、test/、
#                                package.json、scripts/ 等实际影响插件产物的文件；
#                                纯 README / 文档 / .md / 许可证改动不触发发布
#
# Tag 命名规则：
#   - package.json version 与远端已有 tag 一致且指向当前提交 → 跳过发布（幂等保护）
#   - version 相同但指向不同提交 → 追加 -build.N 后缀（兜底，正常走 tag 触发不会碰到）
name: Release DSH Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'client/**'
      - 'personas/**'
      - 'extensions/**'
      - 'cordis.patch.yml'
      - 'package.json'
      - 'test/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  # 审计 S14：工作流级默认只读。发布需要的写权限只给 publish job。
  # 过去整条流程（npm ci / lint / test:all / build）都跑在 contents: write 下：
  # 构建与测试阶段执行的任何东西（含 npm 生命周期脚本、依赖的 postinstall）
  # 都能拿着可写 token 改仓库、发 Release。
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 构建与验证：只读 token ────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # 审计 S14：不把 token 持久化进 .git/config。构建阶段不需要推送，
          # 留着它等于给 npm 生命周期脚本一个现成的可写凭据。
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install Root Test Dependencies
        run: npm ci

      - name: Install Extension Test Dependencies
        run: npm ci --prefix extensions/tieba-reader

      - name: Run Static Checks
        run: npm run lint

      - name: Run Test Suite
        run: npm run test:all

      # 审计 Q20：这里原本还有一个显式 `npm run build:client`。client 产物在
      # 一次运行里被构建三次（test:all 串的 build-client、这一步、npm pack 的
      # prepack）。删除重复步骤；产物一致性由 prepack 兜底，「忘了提交产物」的
      # 漂移门禁由 verify.yml 的 check:client（--check 只比对不落盘）守住。

      - name: Check Package Contents
        run: npm run pack:check

      - name: Determine Version and Tag
        id: meta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          SKIP=false

          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json version ${VERSION} 不一致（期望 ${TAG}）"
            exit 1
          fi

          # 审计 S14：checkout 关掉了 persist-credentials（不让 token 落到 .git/config
          # 给 npm 生命周期脚本用），所以这里显式带上本 job 的**只读** token 拉 tag。
          # 仓库若转为私有，这一步也不会静默失败。
          git fetch --tags --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" || true

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # tag 推送 = 明确的发版意图，无条件发布
            echo "由 tag ${GITHUB_REF_NAME} 触发，直接发布"
          else
            # main push：幂等保护，避免重复发版污染 Release 列表
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              TAG_COMMIT=$(git rev-list -n 1 "${TAG}" 2>/dev/null || echo "")
              if [ "${TAG_COMMIT}" = "${GITHUB_SHA}" ]; then
                echo "当前提交 ${GITHUB_SHA} 已存在 tag ${TAG}，跳过重复发布"
                SKIP=true
              else
                echo "package.json version 仍是 ${VERSION} 且 tag ${TAG} 已指向其他提交；如需重新发版请更新 version 或打 tag"
                SKIP=true
              fi
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"
          echo "Target tag: ${TAG} (Package version: ${VERSION}, skip=${SKIP})"

      - name: Extract Release Notes
        if: steps.meta.outputs.skip != 'true'
        run: |
          node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          const sections = changelog.split(/\r?\n##\s+/).slice(1);
          const target = sections.find(s => {
            const title = s.split(/\r?\n/)[0].trim();
            return title === pkg.version || title === "v" + pkg.version;
          }) || sections.find(s => s.split(/\r?\n/)[0].trim() === "未发布") || sections[0];

          let notes = "详见版本提交明细。";
          if (target) {
            notes = target.split(/\r?\n/).slice(1).join("\n").trim();
          }
          fs.writeFileSync("RELEASE_NOTES.md", notes, "utf8");
          '
          echo "=== RELEASE_NOTES.md Preview ==="
          head -n 25 RELEASE_NOTES.md

      - name: Pack DSH Plugin (.tgz)
        id: pack
        if: steps.meta.outputs.skip != 'true'
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          TGZ=$(ls dist/*.tgz | head -n 1)
          # 版本名 + 免版本名双资产：市场 tarball 可用 latest/download/ 免腐烂链接
          cp "${TGZ}" dist/dsh-qq-hub.tgz
          echo "tgz_path=${TGZ}" >> "$GITHUB_OUTPUT"
          echo "Packaged plugin: ${TGZ}"
          ls -lh dist/

      - name: Upload Build Artifacts
        if: steps.meta.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-plugin-release
          path: |
            dist/*.tgz
            RELEASE_NOTES.md
          if-no-files-found: error

  # ── 发布：唯一持有写权限的 job ─────────────────────────────────────────────
  # 审计 S14：构建/测试与发布分成两个 job。构建阶段即使被依赖的 postinstall
  # 或 npm 生命周期脚本做了坏事，拿到的也只是只读 token；写权限只存在于这个
  # 不做任何构建、只把已产出的 tgz 交给 Release 的 job 里。
  publish:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Build Artifacts
        # 注意：download-artifact 与 upload-artifact 是**两个不同的仓库**，
        # SHA 不能互用（第一版就抄错了，靠显式核对 tag→commit 才发现）。
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dsh-plugin-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Release ${{ needs.build.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(needs.build.outputs.tag, '-test.') }}
          files: |
            dist/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
