name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      # R1 门禁（报告 §6/§7.7）：覆盖所有重构工作分支，避免直接推送不触发 CI
      - 'refactor/**'
      - 'backup/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/tieba-reader/package-lock.json

      - name: Install Root Test Dependencies
        run: npm ci

      # client/client.js 是 esbuild 构建产物，和 client/src 一起入库。
      # 改了 src 却忘了 `npm run build:client` 时，测试会现场构建、照样全绿，所以必须单独比对产物本身。
      # 放在测试之前 fail fast：`--check` 只比对不落盘，同一份逻辑本地 pre-push 钩子也在用
      # （scripts/build-client.mjs --check / .githooks/pre-push）。
      - name: Verify Client Bundle Is Up To Date
        run: npm run check:client

      - name: Install Extension Test Dependencies
        run: npm ci --prefix extensions/tieba-reader

      - name: Run Static Checks
        run: npm run lint

      - name: Run All Tests
        run: npm run test:all

      - name: Run Deterministic Benchmark
        run: npm run benchmark -- --output artifacts/benchmark.json

      - name: Upload Benchmark Result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-node-22.13.0
          path: artifacts/benchmark.json
          if-no-files-found: error

      - name: Check Package Contents
        run: npm run pack:check

      - name: Smoke Test Packed Package
        run: npm run smoke:pack

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Root Test Dependencies
        run: npm ci

      - name: Smoke Test Packed Package
        run: npm run smoke:pack
