name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      # R1 门禁（报告 §6/§7.7）：覆盖所有重构工作分支，避免直接推送不触发 CI
      - 'refactor/**'
      - 'backup/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        # 2026-11-21：主测试从 22.13.0 提到 24，与开发机（24.22.3）对齐。
        # 起因：PR #201 在 22.13.0 上报 cancelledByParent、本地 24 全绿，
        # 判断成本被版本差异放大了。老版本的支持面由下面的 compatibility job 守住。
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/tieba-reader/package-lock.json

      - name: Install Root Test Dependencies
        run: npm ci

      # client/client.js 是 esbuild 构建产物，和 client/src 一起入库。
      # 改了 src 却忘了 `npm run build:client` 时，测试会现场构建、照样全绿，所以必须单独比对产物本身。
      # 放在测试之前 fail fast：`--check` 只比对不落盘，同一份逻辑本地 pre-push 钩子也在用
      # （scripts/build-client.mjs --check / .githooks/pre-push）。
      - name: Verify Client Bundle Is Up To Date
        run: npm run check:client

      - name: Install Extension Test Dependencies
        run: npm ci --prefix extensions/tieba-reader

      - name: Run Static Checks
        run: npm run lint

      - name: Run All Tests
        run: npm run test:all

      - name: Run Deterministic Benchmark
        run: npm run benchmark -- --output artifacts/benchmark.json

      - name: Upload Benchmark Result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-node-24
          path: artifacts/benchmark.json
          if-no-files-found: error

      - name: Check Package Contents
        run: npm run pack:check

      - name: Smoke Test Packed Package
        run: npm run smoke:pack

  # 兼容性门禁：在 package.json 的 engines 下限（>=22.13.0）上跑**完整测试**。
  # 2026-11-21 之前这个 job 跑 Node 24 但只做 smoke；主测试在 22.13.0 上跑全套。
  # 两者对调之后：主测试对齐开发机（24），下限支持面由这里守 —— 声明的最低版本
  # 仍然真的被验证过，而不是只能靠 CI 之外的人手动跑。
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/tieba-reader/package-lock.json

      - name: Install Root Test Dependencies
        run: npm ci

      - name: Install Extension Test Dependencies
        run: npm ci --prefix extensions/tieba-reader

      - name: Run All Tests
        run: npm run test:all

      - name: Smoke Test Packed Package
        run: npm run smoke:pack
